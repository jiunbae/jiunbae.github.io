<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 소문: ㅅ(말)이 ㅁ(만든 것) 위로 걸쳐 들어온다. 읽는 순서대로 ㅅ 왼쪽, ㅁ 오른쪽.
       활자 방식: 획은 수평으로 자른 평행사변형, 수직 기준 30°, 두께 118. ㅅ과 ㅁ은 밑선 800을 공유.
       ㅁ 464×464, 모서리 72. ㅁ 안쪽의 ㅅ은 종이색으로 반전. -->
  <defs><clipPath id="box"><rect x="420" y="336" width="464" height="464" rx="72"/></clipPath></defs>
  <rect x="420" y="336" width="464" height="464" rx="72" fill="#123F3A"/>
  <g fill="#123F3A"><polygon points="474.0,160 610.3,160 240.8,800 104.5,800"/><polygon points="363.1,352.0 499.4,352.0 758.1,800 621.8,800"/></g>
  <g clip-path="url(#box)"><g fill="#F3F4F2"><polygon points="474.0,160 610.3,160 240.8,800 104.5,800"/><polygon points="363.1,352.0 499.4,352.0 758.1,800 621.8,800"/></g></g>
</svg>
